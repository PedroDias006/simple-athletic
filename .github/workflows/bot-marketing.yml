# Roda o bot de marketing a cada hora e salva o histórico (bots/marketing/postados.json).
# Explicação completa em bots/marketing/README.md.
name: Bot de marketing

on:
  schedule:
    # Minuto 17 de toda hora (UTC). O próprio bot só posta das 8h às 22h de Brasília.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "teste = só mostra os posts (dry-run); publicar = posta de verdade"
        type: choice
        options: [teste, publicar]
        default: teste
      forcar:
        description: "Ignorar horário e limite de posts (só para testar)"
        type: boolean
        default: false

permissions:
  contents: write # para salvar postados.json (e o card temporário do Instagram)

concurrency:
  group: bot-marketing
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Rodar o bot
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          WHATSAPP_ENABLED: ${{ vars.WHATSAPP_ENABLED }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          WHATSAPP_TEMPLATE: ${{ vars.WHATSAPP_TEMPLATE }}
          MAX_POSTS_DIA: ${{ vars.MAX_POSTS_DIA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.modo }}" = "teste" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.forcar }}" = "true" ]; then ARGS="$ARGS --forcar"; fi
          npm run bot:marketing -- $ARGS

      - name: Salvar histórico de posts
        if: always()
        run: |
          git config user.name "simple-athletic-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bots/marketing/postados.json
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
            exit 0
          fi
          git commit -m "bot de marketing: atualiza postados.json [skip ci]"
          for tentativa in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
