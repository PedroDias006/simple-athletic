name: Bot de promoções

on:
  # Uma rodada por dia (antes era de hora em hora). Cada rodada gera um commit, e cada commit faz a
  # Cloudflare compilar o site de novo: de hora em hora isso estourava o limite grátis de builds.
  schedule:
    - cron: "17 9 * * *" # 06:17 de Brasília (09:17 UTC)
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: bot-promocoes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    # A rodada diária busca todos os termos de uma vez (sem rodízio), então demora mais.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Testar o conector da Awin (feed de exemplo, sem internet)
        run: npm run test:bot

      - name: Rodar o bot
        run: npm run bot:promocoes
        env:
          # 1 = todos os termos em toda rodada (com uma rodada por dia, o rodízio deixaria termos 3 dias sem busca).
          BOT_RODIZIO: "1"
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_AFFILIATE_TAG: ${{ secrets.ML_AFFILIATE_TAG }}
          ML_AFFILIATE_TOOL: ${{ secrets.ML_AFFILIATE_TOOL }}
          # Amazon Creators API: credenciais liberadas após 10 vendas qualificadas em 30 dias.
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          # A tag de associado é pública (aparece em todo link); o secret só serve para trocá-la.
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG || 'simpleathleti-20' }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          # Awin (Netshoes, Centauro, Decathlon): chave de feeds de produtos, em Toolbox > Create-a-Feed.
          AWIN_FEED_API_KEY: ${{ secrets.AWIN_FEED_API_KEY }}
          LOMADEE_APP_TOKEN: ${{ secrets.LOMADEE_APP_TOKEN }}
          LOMADEE_SOURCE_ID: ${{ secrets.LOMADEE_SOURCE_ID }}

      - name: Conferir se o site ainda compila
        run: npm run typecheck

      - name: Commit se mudou (a Cloudflare republica o site sozinha)
        run: |
          # A memória do bot (histórico de preços, decisões, relatório) também precisa ser salva:
          # o computador do GitHub Actions é apagado depois de cada execução.
          git add -A -- src/data/products.json src/data/details.json next.config.ts bots/promocoes/dados
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "bot-promocoes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "bot: atualiza ofertas"
          git pull --rebase
          git push
