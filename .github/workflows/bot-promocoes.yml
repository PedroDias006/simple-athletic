name: Bot de promoções

on:
  schedule:
    - cron: "17 * * * *" # de hora em hora (minuto 17 para fugir do pico das :00)
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: bot-promocoes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Rodar o bot
        run: npm run bot:promocoes
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_AFFILIATE_TAG: ${{ secrets.ML_AFFILIATE_TAG }}
          ML_AFFILIATE_TOOL: ${{ secrets.ML_AFFILIATE_TOOL }}
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          LOMADEE_APP_TOKEN: ${{ secrets.LOMADEE_APP_TOKEN }}
          LOMADEE_SOURCE_ID: ${{ secrets.LOMADEE_SOURCE_ID }}

      - name: Conferir se o site ainda compila
        run: npm run typecheck

      - name: Commit se mudou (a Cloudflare republica o site sozinha)
        run: |
          # A memória do bot (histórico de preços, decisões, relatório) também precisa ser salva:
          # o computador do GitHub Actions é apagado depois de cada execução.
          git add -A -- src/data/products.json next.config.ts bots/promocoes/dados
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "bot-promocoes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "bot: atualiza ofertas"
          git pull --rebase
          git push
